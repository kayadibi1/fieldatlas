    - heading "REST API" [level=1] [ref=e33]
    - heading "Overview" [level=2] [ref=e34]
    - paragraph [ref=e35]: The REST API gives anyone free, programmatic access to the Unpaywall database.
    - paragraph [ref=e36]:
      - text: If you're using the API, we recommend you subscribe to the
      - link "mailing list" [ref=e37] [cursor=pointer]:
        - /url: https://groups.google.com/forum/#!forum/unpaywall
      - text: in order to stay up-to-date when there are changes or new features.
    - heading "Schema" [level=2] [ref=e38]
    - paragraph [ref=e39]:
      - text: The API response uses the same
      - link "shared schema" [ref=e40] [cursor=pointer]:
        - /url: /data-format
      - text: as the
      - link "database snapshot" [ref=e41] [cursor=pointer]:
        - /url: /products/snapshot
      - text: and
      - link "Data Feed." [ref=e42] [cursor=pointer]:
        - /url: /products/data-feed
    - heading "Authentication" [level=2] [ref=e43]
    - paragraph [ref=e44]:
      - text: "Requests must include your email as a parameter at the end of the URL, like this:"
      - code [ref=e45]:
        - text: api.unpaywall.org/my/request
        - strong [ref=e46]: "?email=YOUR_EMAIL"
      - text: .
    - heading "Rate limits" [level=2] [ref=e47]
    - paragraph [ref=e48]:
      - text: Please limit use to 100,000 calls per day. If you need faster access, you'll be better served by downloading the entire
      - link "database snapshot" [ref=e49] [cursor=pointer]:
        - /url: /products/snapshot
      - text: for local access.
    - heading "Versions" [level=2] [ref=e50]
    - paragraph [ref=e51]:
      - text: The current version of the API is Version 2, and this is the only version supported. Version updates are announced on the
      - link "mailing list." [ref=e52] [cursor=pointer]:
        - /url: https://groups.google.com/forum/#!forum/unpaywall
    - heading "Alternatives" [level=2] [ref=e53]
    - paragraph [ref=e54]: "Depending on your use case, there are often easier ways to access the data than using the API. You can learn more about these in our brief Get Stated pages:"
